name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # test_hybrid_train/test_patch_sequence import modules that use TensorFlow,
      # so CI needs it too (CPU build); without it those tests failed to import.
      - name: Install dependencies (CPU-only TensorFlow)
        run: |
          pip install "tensorflow-cpu>=2.13,<2.16" numpy opencv-python-headless PyWavelets scipy scikit-learn joblib matplotlib pytest
      - name: Run unit tests
        run: |
          cd src && python -m pytest ../tests -v
